name: Build Windows app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build the app
        run: pyinstaller --noconfirm --windowed --name StreamCutter --collect-all tkinterdnd2 main.py

      - name: Zip the app
        shell: pwsh
        run: Compress-Archive -Path dist/StreamCutter -DestinationPath StreamCutter-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: StreamCutter-windows-run${{ github.run_number }}
          path: StreamCutter-windows.zip

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: StreamCutter-windows.zip
